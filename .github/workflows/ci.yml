name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# TODO: pin actions to commit SHAs (docs/18 §11) once the repository exists.
env:
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_APP_ENV: local
  # Build-time env validation only; nothing connects during `next build`.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  COOKIE_SECRET: ci-only-cookie-secret-0123456789abcdef
  # Clerk development instance (repo secrets). The fallbacks only satisfy build-time validation;
  # E2E sign-in flows need the real secrets.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || 'pk_test_Y2kuY2xlcmsuYWNjb3VudHMuZGV2JA' }} # gitleaks:allow (fake placeholder; publishable keys are public)
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_ci_placeholder' }}
  # Stripe test mode (repo secrets); same fallback rule as Clerk.
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY || 'pk_test_ci_placeholder' }}
  STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_ci_placeholder' }}

jobs:
  verify:
    name: Format · Lint · Typecheck · Unit tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile # postinstall runs `prisma generate`
      - run: pnpm tokens
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration (real Postgres, migrations, seed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Embedded Postgres per run (no service container needed); applies the production migrations.
      - run: pnpm test:int

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E smoke (Playwright)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://nura:nura@localhost:5433/nura_dev
      DIRECT_URL: postgresql://nura:nura@localhost:5433/nura_dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Browser requests go through Clerk's middleware: placeholder keys make every page fail.
      - name: Require Clerk development keys
        run: |
          if [ "$CLERK_SECRET_KEY" = "sk_test_ci_placeholder" ]; then
            echo "::error::Add the CLERK_PUBLISHABLE_KEY and CLERK_SECRET_KEY repository secrets (Clerk development instance) to run E2E."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      # The storefront reads the catalogue at request time: give the app a migrated, seeded database
      # (embedded Postgres, same as local dev). The build itself still never connects.
      - name: Start database, migrate and seed
        run: |
          nohup pnpm db:local > db-local.log 2>&1 &
          timeout 180 bash -c 'until grep -q "Local Postgres ready" db-local.log; do sleep 2; done' || (cat db-local.log; exit 1)
          pnpm db:deploy
          pnpm db:seed
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
